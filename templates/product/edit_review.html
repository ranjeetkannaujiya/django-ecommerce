{% extends "base/base.html" %}

{% block start %}

<div class="row justify-content-center px-2">

<div class="col-xl-6 col-lg-7 col-md-9 col-sm-11 col-12">

    <div class="card border-0 shadow">

        <div class="card-header bg-white">

            <h3 class="font-weight-bold mb-0 text-center">
                Edit Review
            </h3>

        </div>

        <div class="card-body p-3 p-md-4">

            <form method="POST">

                {% csrf_token %}

                <!-- Rating -->

                <div class="form-group">

                    <label class="font-weight-bold">
                        Rating
                    </label>

                    <select
                        class="form-control"
                        name="rating"
                        required>

                        <option
                            value="5"
                            {% if review.rating == 5 %}selected{% endif %}>
                            ⭐⭐⭐⭐⭐
                        </option>

                        <option
                            value="4"
                            {% if review.rating == 4 %}selected{% endif %}>
                            ⭐⭐⭐⭐
                        </option>

                        <option
                            value="3"
                            {% if review.rating == 3 %}selected{% endif %}>
                            ⭐⭐⭐
                        </option>

                        <option
                            value="2"
                            {% if review.rating == 2 %}selected{% endif %}>
                            ⭐⭐
                        </option>

                        <option
                            value="1"
                            {% if review.rating == 1 %}selected{% endif %}>
                            ⭐
                        </option>

                    </select>

                </div>

                <!-- Review -->

                <div class="form-group mt-3">

                    <label class="font-weight-bold">
                        Review
                    </label>

                    <textarea
                        class="form-control"
                        rows="5"
                        name="review"
                        placeholder="Write your review..."
                        required>{{ review.review }}</textarea>

                </div>

                <!-- Button -->

                <div class="text-center mt-3">

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="fa fa-save mr-1"></i>
                        Update Review

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</div>

{% endblock %}
