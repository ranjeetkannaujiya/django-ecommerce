{% extends "base/base.html" %}

{% block start %}

<div class="container-fluid px-2 px-md-4 py-3">

<div class="row justify-content-center">

    <div class="col-12 col-lg-8 col-xl-7">

        <div class="card shadow border-0">

            <!-- HEADER -->
            <div class="card-header bg-white text-center py-3">

                <h3 class="mb-1 font-weight-bold">
                    Add New Address
                </h3>

                <p class="text-muted mb-0">
                    Enter your delivery details
                </p>

            </div>


            <!-- FORM -->
            <div class="card-body p-3 p-md-4">

                <form method="POST">

                    {% csrf_token %}


                    <!-- NAME + PHONE -->
                    <div class="row">

                        <div class="col-12 col-md-6 mb-3">

                            <label class="font-weight-bold">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                placeholder="Enter Full Name"
                                required
                            >

                        </div>


                        <div class="col-12 col-md-6 mb-3">

                            <label class="font-weight-bold">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                placeholder="Enter Phone Number"
                                maxlength="15"
                                required
                            >

                        </div>

                    </div>


                    <!-- ADDRESS -->
                    <div class="mb-3">

                        <label class="font-weight-bold">
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="4"
                            placeholder="House No, Street, Area"
                            required
                        ></textarea>

                    </div>


                    <!-- CITY STATE PINCODE -->
                    <div class="row">

                        <div class="col-12 col-md-4 mb-3">

                            <label class="font-weight-bold">
                                City
                            </label>

                            <input
                                type="text"
                                name="city"
                                class="form-control"
                                placeholder="City"
                                required
                            >

                        </div>


                        <div class="col-12 col-md-4 mb-3">

                            <label class="font-weight-bold">
                                State
                            </label>

                            <input
                                type="text"
                                name="state"
                                class="form-control"
                                placeholder="State"
                                required
                            >

                        </div>


                        <div class="col-12 col-md-4 mb-3">

                            <label class="font-weight-bold">
                                Pincode
                            </label>

                            <input
                                type="text"
                                name="pincode"
                                class="form-control"
                                placeholder="Pincode"
                                maxlength="6"
                                inputmode="numeric"
                                required
                            >

                        </div>

                    </div>


                    <!-- BUTTONS -->
                    <div class="d-flex flex-column flex-sm-row justify-content-center mt-3">

                        <a
                            href="{% url 'address' %}"
                            class="btn btn-outline-secondary mb-2 mb-sm-0 mr-sm-2"
                        >
                            Back
                        </a>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Address
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

{% endblock %}
